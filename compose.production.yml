name: retreat-api

# Only these settings reach the API. In particular, do not pass through local
# AWS access keys; production uses the attached EC2 instance role.
x-api-environment: &api-environment
  NODE_ENV: production
  PORT: '3100'
  DATABASE_URL: 'postgresql://retreat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}@db:5432/retreat?schema=public&connection_limit=5&connect_timeout=10'
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the server .env}
  FRONTEND_URL: ${FRONTEND_URL:?Set the actual frontend HTTPS origin}
  CORS_ORIGINS: ${FRONTEND_URL:?Set the actual frontend HTTPS origin}
  AWS_REGION: ${AWS_REGION:?Set AWS_REGION in the server .env}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set the production S3 bucket}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16-bookworm
    shm_size: 128m
    mem_limit: 512m
    command: ['postgres', '-c', 'max_connections=30']
    restart: unless-stopped
    environment:
      POSTGRES_USER: retreat
      POSTGRES_DB: retreat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-h',
          '127.0.0.1',
          '-U',
          'retreat',
          '-d',
          'retreat',
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    stop_grace_period: 60s
    logging: *bounded-logging

  api:
    image: retreat-api:${RELEASE_TAG:-local}
    mem_limit: 1g
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

    ports:
      - '127.0.0.1:8081:3100'
    networks:
      - database
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *bounded-logging

  operator:
    profiles: [tools]
    image: retreat-api-operator:${RELEASE_TAG:-local}
    mem_limit: 768m
    build:
      context: .
      target: operator
    init: true
    restart: 'no'
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

volumes:
  postgres-data:
    name: retreat-postgres-data

networks:
  database:
    internal: true

  egress: {}
